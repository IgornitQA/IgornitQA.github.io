name: Автотесты сайта

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # понедельник 09:00 МСК: опубликованный сайт и внешние ссылки

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Зависимости
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Прогон
        env:
          SITE_URL: ${{ github.event_name == 'schedule' && 'https://igornitqa.github.io' || '' }}
          MARKERS: ${{ github.event_name == 'schedule' && '' || 'not external' }}
        run: >
          python -m pytest -m "$MARKERS"
          --junitxml=results/junit.xml --alluredir=results/allure
          --screenshot only-on-failure --output results/artifacts

      - name: Сводка
        if: always()
        run: python summary.py results/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/results
          retention-days: 14
